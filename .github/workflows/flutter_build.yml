name: Flutter CI with Release

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
          - info
          - warning
          - error
  push:
    tags:
      - 'v*'  # Trigger on tags like v1.0, v2.0 etc.
  # Or, to trigger on every push to main, comment the above and uncomment below:
  # push:
  #   branches:
  #     - main
jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.2'  # Specify your Flutter version

      - name: Run flutter analyze
        run: flutter analyze

      - name: Build APK without signing
        run: flutter build apk --release

      - name: Get APK path
        id: apk_path
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            echo "APK_PATH=$APK_PATH" >> $GITHUB_OUTPUT
          else
            echo "APK not found at $APK_PATH"
            exit 1
          fi

      - name: Create GitHub Release
        id: create_release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK to Release
        if: startsWith(github.ref, 'refs/tags:') && steps.create_release.outputs.upload_url != ''
        run: |
          if [ -f "${{ steps.apk_path.outputs.path }}" ]; then
            echo "Uploading APK..."
            UPLOAD_URL="${{ steps.create_release.outputs.upload_url }}"
            # Remove the template part
            UPLOAD_URL=${UPLOAD_URL/\{\?name,label\}/}
            curl -H "Authorization: token $GITHUB_TOKEN" \
                 -H "Content-Type: application/vnd.android.package-archive" \
                 --data-binary "@${{ steps.apk_path.outputs.path }}" \
                 "$UPLOAD_URL?name=app-release.apk"
          else
            echo "APK file not found, skipping upload."
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}